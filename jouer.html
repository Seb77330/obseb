<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Sécurité : seuls les scripts du site tournent ; la page ne parle qu'au relais ntfy.sh (questions et votes) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://ntfy.sh; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Joue avec nous · MESA</title>
<link rel="icon" href="img/mesa-icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/mesa-icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/jouer.css?v=0f664a2c">
</head>
<body>
<main id="jeu" data-etat="connexion">
  <header class="j-tete">
    <img src="img/mesa-icone.svg" alt="" width="30" height="30">
    <div class="j-tete-txt"><b>Joue avec nous</b><span id="j-live">Quiz en direct</span></div>
    <span class="j-direct" id="j-direct"><i></i>En direct</span>
  </header>

  <section class="j-attente" id="j-attente">
    <div class="j-points" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1 id="j-attente-titre">Connexion au live…</h1>
    <p id="j-attente-txt">Garde cette page ouverte : la question arrive ici dès qu'elle est lancée.</p>
  </section>

  <section class="j-question" id="j-question" hidden>
    <div class="j-q-tete">
      <span class="j-tag">Question</span>
      <span class="j-chrono" aria-live="off"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="fond" cx="22" cy="22" r="19"/><circle class="reste" id="j-anneau" cx="22" cy="22" r="19"/></svg><b id="j-temps"></b></span>
    </div>
    <h1 class="j-q" id="j-q"></h1>
    <div class="j-choix" id="j-choix"></div>
    <div class="j-verdict" id="j-verdict" aria-live="polite"></div>
    <div class="j-chat" id="j-chat" hidden><div class="j-chat-ligne"><span>Le chat</span><b id="j-chat-pct"></b><em id="j-chat-n"></em></div><div class="j-chat-barre"><i id="j-chat-barre"></i></div></div>
  </section>

  <footer class="j-pied">
    <span id="j-score"></span>
    <span>Anonyme : ton nom n'est jamais demandé.</span>
  </footer>
</main>
<section class="j-erreur" id="j-erreur" hidden>
  <img src="img/mesa-icone.svg" alt="" width="48" height="48">
  <h1>Ce lien est incomplet</h1>
  <p>Scanne à nouveau le code « Jouer avec nous » affiché dans le live.</p>
</section>
<script src="js/jouer.js?v=b14db7f8"></script>
</body>
</html>
