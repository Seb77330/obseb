<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- « Minuit Néon » : un film inventé pour les démos (une rue sous la pluie, une silhouette sous un parapluie) -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090a1f"/><stop offset=".7" stop-color="#1d1442"/><stop offset="1" stop-color="#3b1658"/></linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0f33"/><stop offset="1" stop-color="#05040c"/></linearGradient>
    <radialGradient id="lampe" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd38a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
    <filter id="lueur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="flou"><feGaussianBlur stdDeviation="10"/></filter>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ciel)"/>
  <!-- immeubles au loin -->
  <g fill="#120c2a">
    <rect x="0" y="260" width="180" height="400"/><rect x="170" y="180" width="140" height="480"/><rect x="300" y="300" width="120" height="360"/>
    <rect x="1180" y="220" width="160" height="440"/><rect x="1330" y="140" width="130" height="520"/><rect x="1450" y="280" width="150" height="380"/>
  </g>
  <g fill="#ffcf7a" opacity=".55">
    <rect x="200" y="220" width="14" height="10"/><rect x="230" y="260" width="14" height="10"/><rect x="260" y="220" width="14" height="10"/><rect x="200" y="320" width="14" height="10"/><rect x="260" y="380" width="14" height="10"/>
    <rect x="1360" y="180" width="14" height="10"/><rect x="1390" y="240" width="14" height="10"/><rect x="1420" y="180" width="14" height="10"/><rect x="1360" y="320" width="14" height="10"/><rect x="1210" y="260" width="14" height="10"/><rect x="1240" y="340" width="14" height="10"/>
  </g>
  <!-- façades proches -->
  <path d="M0 120 L 480 260 V 660 H 0z" fill="#0d0820"/>
  <path d="M1600 120 L 1120 260 V 660 H 1600z" fill="#0d0820"/>
  <!-- enseignes -->
  <g filter="url(#lueur)" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <rect x="70" y="250" width="250" height="84" rx="10" fill="none" stroke="#ff3ea5" stroke-width="5" transform="skewY(16)"/>
    <text x="195" y="308" fill="#ff7cc4" font-size="44" text-anchor="middle" transform="skewY(16)">HÔTEL</text>
    <text x="1395" y="300" fill="#4ef0ff" font-size="52" text-anchor="middle" transform="translate(1395 0) skewY(-16) translate(-1395 0)">BAR</text>
    <rect x="1300" y="245" width="190" height="80" rx="10" fill="none" stroke="#4ef0ff" stroke-width="5" transform="translate(1395 0) skewY(-16) translate(-1395 0)"/>
    <rect x="370" y="430" width="10" height="150" rx="5" fill="#b45cff"/>
    <rect x="1220" y="440" width="10" height="130" rx="5" fill="#ffd34e"/>
  </g>
  <!-- la rue mouillée -->
  <path d="M0 660 H1600 V900 H0z" fill="url(#sol)"/>
  <g filter="url(#flou)" opacity=".55">
    <rect x="120" y="700" width="160" height="150" fill="#ff3ea5"/>
    <rect x="1320" y="700" width="140" height="150" fill="#4ef0ff"/>
    <rect x="360" y="690" width="30" height="160" fill="#b45cff"/>
    <rect x="1212" y="690" width="26" height="140" fill="#ffd34e"/>
    <ellipse cx="800" cy="760" rx="160" ry="40" fill="#ffb35c"/>
  </g>
  <!-- réverbère -->
  <rect x="790" y="300" width="8" height="380" fill="#07050f"/>
  <path d="M770 300 h48 l-8 -22 h-32z" fill="#07050f"/>
  <circle cx="794" cy="330" r="200" fill="url(#lampe)" opacity=".6"/>
  <!-- silhouette au parapluie -->
  <g fill="#05030a">
    <path d="M640 520 C 650 470 700 450 740 450 C 780 450 830 470 840 520 C 820 510 800 512 790 520 C 778 510 758 510 740 520 C 722 510 702 510 690 520 C 680 512 660 510 640 520z"/>
    <rect x="738" y="450" width="4" height="110"/>
    <path d="M716 545 C 716 530 726 522 740 522 C 754 522 764 530 764 545 L 770 640 L 756 640 L 750 700 L 742 700 L 740 650 L 738 700 L 730 700 L 724 640 L 710 640z"/>
    <circle cx="740" cy="530" r="0"/>
  </g>
  <ellipse cx="740" cy="704" rx="60" ry="8" fill="#000" opacity=".5"/>
  <!-- pluie -->
  <g stroke="#cfd8ff" stroke-width="2" opacity=".28" stroke-linecap="round">
    <path d="M100 40 l-14 46M260 120 l-14 46M420 30 l-14 46M560 160 l-14 46M700 60 l-14 46M860 140 l-14 46M1020 40 l-14 46M1160 170 l-14 46M1300 70 l-14 46M1480 130 l-14 46"/>
    <path d="M180 360 l-14 46M340 420 l-14 46M520 320 l-14 46M640 400 l-14 46M900 340 l-14 46M1040 420 l-14 46M1200 360 l-14 46M1400 420 l-14 46M1540 360 l-14 46"/>
    <path d="M60 600 l-14 46M300 560 l-14 46M480 620 l-14 46M960 580 l-14 46M1100 620 l-14 46M1360 580 l-14 46"/>
  </g>
  <rect width="1600" height="900" fill="url(#vign)"/>
</svg>
