<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- « Horizon Rouge » : un film inventé pour les démos (désert au coucher du soleil, un cavalier sur la crête) -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1036"/>
      <stop offset=".38" stop-color="#5b1f4a"/>
      <stop offset=".62" stop-color="#d8533a"/>
      <stop offset=".78" stop-color="#ffb35c"/>
    </linearGradient>
    <radialGradient id="soleil" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".55" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8432f"/><stop offset="1" stop-color="#6e2230"/></linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a2433"/><stop offset="1" stop-color="#3a1330"/></linearGradient>
    <linearGradient id="d3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1330"/><stop offset="1" stop-color="#14081c"/></linearGradient>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ciel)"/>
  <!-- étoiles qui s'effacent -->
  <g fill="#fff" opacity=".7">
    <circle cx="120" cy="70" r="1.6"/><circle cx="310" cy="140" r="1.2"/><circle cx="520" cy="60" r="1.8"/><circle cx="760" cy="110" r="1.1"/>
    <circle cx="980" cy="50" r="1.5"/><circle cx="1210" cy="130" r="1.3"/><circle cx="1420" cy="80" r="1.7"/><circle cx="1530" cy="170" r="1"/>
    <circle cx="660" cy="190" r="1"/><circle cx="1100" cy="200" r="1"/><circle cx="220" cy="230" r="1"/>
  </g>
  <!-- deux lunes : c'est un autre monde -->
  <circle cx="1270" cy="190" r="46" fill="#f3d9c9" opacity=".85"/>
  <circle cx="1290" cy="180" r="44" fill="#4a1a45" opacity=".55"/>
  <circle cx="1380" cy="250" r="16" fill="#f3d9c9" opacity=".7"/>
  <circle cx="560" cy="600" r="420" fill="url(#halo)"/>
  <circle cx="560" cy="585" r="150" fill="url(#soleil)"/>
  <!-- bandes de chaleur devant le soleil -->
  <g fill="#ffb35c" opacity=".35">
    <rect x="380" y="560" width="360" height="5" rx="2.5"/><rect x="410" y="580" width="300" height="4" rx="2"/><rect x="440" y="598" width="240" height="3" rx="1.5"/>
  </g>
  <path d="M0 640 C 220 600 380 610 560 640 S 980 600 1180 625 S 1480 610 1600 600 V900 H0z" fill="url(#d1)"/>
  <path d="M0 700 C 260 650 520 720 760 690 S 1180 640 1600 690 V900 H0z" fill="url(#d2)"/>
  <!-- la crête au premier plan et le cavalier -->
  <path d="M0 790 C 300 760 620 700 980 712 C 1200 720 1420 770 1600 800 V900 H0z" fill="url(#d3)"/>
  <g fill="#0d0612" transform="translate(1010 610) scale(1.15)">
    <!-- monture -->
    <path d="M10 92 C 14 70 30 60 58 60 C 80 60 96 58 108 46 C 114 40 122 36 128 40 L 136 34 L 138 44 C 142 50 140 58 132 60 C 124 62 118 70 116 80 L 114 104 L 108 104 L 108 84 C 100 88 84 90 70 88 L 66 104 L 60 104 L 60 88 C 46 88 34 86 28 84 L 26 104 L 20 104 L 20 86 C 14 92 12 100 6 104 L 2 102 C 8 96 8 94 10 92z"/>
    <!-- cavalier et sa cape au vent -->
    <path d="M58 60 L 54 30 C 54 22 60 16 66 16 C 72 16 76 22 76 30 L 74 60z"/>
    <circle cx="66" cy="8" r="9"/>
    <path d="M56 26 C 30 30 10 40 -20 34 C 4 48 26 52 54 46z" opacity=".9"/>
    <path d="M76 34 L 96 -6 L 99 -5 L 80 36z"/>
  </g>
  <!-- poussière -->
  <g fill="#ffd9a8" opacity=".35">
    <circle cx="880" cy="720" r="3"/><circle cx="930" cy="700" r="2"/><circle cx="960" cy="735" r="2.5"/><circle cx="1180" cy="690" r="2"/><circle cx="1240" cy="720" r="3"/><circle cx="300" cy="760" r="2"/>
  </g>
  <rect width="1600" height="900" fill="url(#vign)"/>
</svg>
