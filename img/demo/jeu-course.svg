<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Un jeu de course inventé pour les démos (route au coucher du soleil, une voiture vue de derrière, compteur) -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0f4f"/><stop offset=".55" stop-color="#d23f7a"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0d33"/><stop offset="1" stop-color="#05030d"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a55"/><stop offset="1" stop-color="#141020"/></linearGradient>
    <linearGradient id="carro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a6a"/><stop offset="1" stop-color="#a3122b"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ciel)"/>
  <circle cx="800" cy="430" r="150" fill="#ffd36b" opacity=".9"/>
  <g fill="#2a0f4f" opacity=".55"><rect x="650" y="400" width="300" height="8"/><rect x="660" y="425" width="280" height="7"/><rect x="680" y="448" width="240" height="6"/></g>
  <path d="M0 470 L 220 380 L 380 440 L 560 360 L 720 470z M 880 470 L 1060 350 L 1220 430 L 1400 370 L 1600 450 V470z" fill="#3b1458"/>
  <rect y="470" width="1600" height="430" fill="url(#sol)"/>
  <!-- grille néon -->
  <g stroke="#ff4fa3" stroke-opacity=".45" stroke-width="2">
    <path d="M0 520 H1600 M0 590 H1600 M0 690 H1600 M0 830 H1600"/>
    <path d="M800 470 L -400 900 M800 470 L 0 900 M800 470 L 400 900 M800 470 L 1200 900 M800 470 L 1600 900 M800 470 L 2000 900"/>
  </g>
  <path d="M760 470 L 840 470 L 1250 900 L 350 900z" fill="url(#route)"/>
  <g fill="#ffe08a"><path d="M796 490 h8 l4 40 h-16z"/><path d="M792 570 h16 l7 70 h-30z"/><path d="M786 700 h28 l12 130 h-52z"/></g>
  <!-- la voiture -->
  <g transform="translate(800 760)">
    <ellipse cx="0" cy="92" rx="230" ry="22" fill="#000" opacity=".5"/>
    <path d="M-200 60 C -200 10 -170 -10 -130 -20 L -90 -80 C -80 -96 -60 -104 -40 -104 H 40 C 60 -104 80 -96 90 -80 L 130 -20 C 170 -10 200 10 200 60 V 80 H -200z" fill="url(#carro)"/>
    <path d="M-80 -78 C -74 -90 -60 -94 -46 -94 H 46 C 60 -94 74 -90 80 -78 L 108 -26 H -108z" fill="#1d1430"/>
    <rect x="-190" y="20" width="90" height="20" rx="6" fill="#ff2f4f"/><rect x="100" y="20" width="90" height="20" rx="6" fill="#ff2f4f"/>
    <rect x="-60" y="30" width="120" height="26" rx="4" fill="#f4f4f4"/>
    <text x="0" y="50" font-family="Arial, sans-serif" font-weight="700" font-size="20" text-anchor="middle" fill="#111">MESA 26</text>
    <rect x="-210" y="70" width="70" height="40" rx="10" fill="#0b0814"/><rect x="140" y="70" width="70" height="40" rx="10" fill="#0b0814"/>
  </g>
  <!-- l'interface du jeu -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#fff">
    <text x="60" y="90" font-size="40">TOUR 2/3</text>
    <text x="60" y="140" font-size="28" fill="#ffd36b">1er</text>
    <text x="1540" y="90" font-size="40" text-anchor="end">01:12.48</text>
    <circle cx="1460" cy="790" r="86" fill="#000" fill-opacity=".45" stroke="#fff" stroke-opacity=".4" stroke-width="4"/>
    <text x="1460" y="800" font-size="52" text-anchor="middle">248</text>
    <text x="1460" y="836" font-size="20" text-anchor="middle" fill="#ffd36b">KM/H</text>
  </g>
