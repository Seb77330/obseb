#cloud-config
# OBSeb Cloud : installation automatique du serveur (Ubuntu 24.04, Hetzner CPX32 conseillé : 4 vCPU, 8 Go).
# À la création du serveur, remplacer __OBSEB_SECRET__ par une clé secrète (la régie l'utilise pour piloter le serveur).
package_update: true
package_upgrade: true
# Sécurité : connexion SSH par clé seulement (jamais de mot de passe), pas de root par mot de passe
ssh_pwauth: false
disable_root_opts: 'no-port-forwarding,no-agent-forwarding,no-X11-forwarding'
packages: [ufw, fail2ban, unattended-upgrades, ffmpeg, xvfb, pulseaudio, pulseaudio-utils, fonts-noto-color-emoji, fonts-dejavu, curl, git, debian-keyring, debian-archive-keyring, apt-transport-https]
users:
  - name: obseb
    shell: /bin/bash
    lock_passwd: true
write_files:
  - path: /etc/ssh/sshd_config.d/10-obseb.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 3
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/obseb.env
    permissions: '0600'
    content: |
      OBSEB_SECRET=__OBSEB_SECRET__
      OBSEB_DOSSIER=/var/lib/obseb/enregistrements
      OBSEB_GARDE_JOURS=10
      PORT=8080
  - path: /etc/systemd/system/livekit.service
    content: |
      [Unit]
      Description=OBSeb vidéo (LiveKit)
      After=network-online.target
      [Service]
      ExecStart=/usr/local/bin/livekit-server --config /etc/livekit.yaml
      Restart=always
      LimitNOFILE=500000
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/obseb.service
    content: |
      [Unit]
      Description=OBSeb Cloud (moteur du direct)
      After=network-online.target
      [Service]
      User=obseb
      EnvironmentFile=/etc/obseb.env
      Environment=XDG_RUNTIME_DIR=/var/lib/obseb/run
      ExecStart=/usr/bin/node /opt/obseb/serveur/moteur.js
      Restart=always
      [Install]
      WantedBy=multi-user.target
runcmd:
  # Pare-feu : seuls SSH, le web (HTTPS) et la vidéo sont ouverts ; le moteur (8080) et LiveKit (7880) restent fermés au monde
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 3478/udp
  - ufw allow 7881/tcp
  - ufw allow 50000:60000/udp
  - ufw --force enable
  - systemctl enable --now fail2ban
  # Chrome
  - curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb
  - apt-get install -y /tmp/chrome.deb
  # Node.js 22
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  # Caddy (HTTPS automatique)
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update && apt-get install -y caddy
  # Code OBSeb
  - git clone --depth 1 https://github.com/Seb77330/obseb /opt/obseb
  - mkdir -p /var/lib/obseb/enregistrements /var/lib/obseb/run && chmod 700 /var/lib/obseb/run && chown -R obseb:obseb /var/lib/obseb
  - loginctl enable-linger obseb
  # Adresse HTTPS : <ip-avec-tirets>.sslip.io
  - |
    IP=$(curl -s http://169.254.169.254/hetzner/v1/metadata/public-ipv4)
    printf '%s.sslip.io {\n  header {\n    Strict-Transport-Security "max-age=31536000"\n    X-Content-Type-Options nosniff\n    Referrer-Policy no-referrer\n    -Server\n  }\n  reverse_proxy 127.0.0.1:8080\n}\n' "$(echo $IP | tr . -)" > /etc/caddy/Caddyfile
  # Serveur vidéo LiveKit : clés tirées au hasard sur la machine, jamais écrites ailleurs
  - curl -sSL https://get.livekit.io | bash
  - |
    IP=$(curl -s http://169.254.169.254/hetzner/v1/metadata/public-ipv4)
    DOM="$(echo $IP | tr . -).sslip.io"
    CLE="OB$(openssl rand -hex 6)"; SEC="$(openssl rand -hex 32)"
    cat > /etc/livekit.yaml <<LKEOF
    port: 7880
    bind_addresses: ["127.0.0.1"]
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 60000
      use_external_ip: true
    turn:
      enabled: true
      udp_port: 3478
      domain: lk.$DOM
    keys:
      $CLE: $SEC
    room:
      max_participants: 40
      empty_timeout: 600
    LKEOF
    chmod 600 /etc/livekit.yaml
    printf 'LIVEKIT_API_KEY=%s\nLIVEKIT_API_SECRET=%s\nLIVEKIT_URL_PUBLIQUE=wss://lk.%s\n' "$CLE" "$SEC" "$DOM" >> /etc/obseb.env
    printf 'lk.%s {\n  reverse_proxy 127.0.0.1:7880\n}\n' "$DOM" >> /etc/caddy/Caddyfile
  - systemctl daemon-reload && systemctl enable --now livekit
  - systemctl restart caddy
  - systemctl daemon-reload && systemctl enable --now obseb
