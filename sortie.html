<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Sécurité : le navigateur refuse tout script qui ne vient pas du site lui-même (protège tes clés et tes invités) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBSeb · Sortie</title>
<link rel="stylesheet" href="css/scene.css?v=9c246e4a">
<link rel="stylesheet" href="css/quiz.css?v=3c1204a1">
<link rel="stylesheet" href="css/extras.css?v=60c70530">
<link rel="stylesheet" href="css/watch.css?v=3dc82c0e">
<link rel="stylesheet" href="css/habillages.css?v=1a3e82fd">
<link rel="stylesheet" href="css/diffusion.css?v=534e5005">
<link rel="stylesheet" href="css/chat.css?v=96e0fcff">
</head>
<body class="sortie">
<div id="scale">
  <div id="stage">
    <div class="deco"></div>

    <section id="intro" class="couche plein">
      <div class="sur-titre">Le live commence dans un instant</div>
      <h1 class="grand-titre" data-champ="titre"></h1>
      <div class="ligne"></div>
      <div class="info" id="intro-info">Installe-toi, on arrive</div>
      <div class="compte" id="compte"></div>
      <div class="hote">avec <span data-champ="hote"></span></div>
    </section>

    <section id="ecran" class="couche"></section>
    <section id="tuiles" class="couche"></section>

    <section id="fin" class="couche plein cachee">
      <div class="sur-titre">Merci d'avoir regardé</div>
      <h1 class="grand-titre" data-champ="titre"></h1>
      <div class="ligne"></div>
      <div class="info">Abonne-toi pour ne rien rater</div>
      <div class="handle" data-champ="handle"></div>
    </section>

    <section id="quiz" class="couche cachee">
      <div class="qz-panneau">
        <div class="qz-tete"><span class="qz-tag">Quiz</span><span class="qz-rep" id="qz-rep"></span><span class="qz-chrono"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="fond" cx="22" cy="22" r="19"/><circle class="reste" id="qz-anneau" cx="22" cy="22" r="19"/></svg><b class="qz-temps" id="qz-temps"></b></span></div>
        <div class="qz-corps">
          <img id="qz-img" alt="" hidden>
          <div class="qz-texte">
            <div class="qz-q" id="qz-q"></div>
            <div class="qz-choix" id="qz-choix"></div>
          </div>
        </div>
        <div class="qz-barre"><i id="qz-barre"></i></div>
        <div class="qz-res" id="qz-res"></div>
      </div>
    </section>
    <section id="classement" class="couche cachee">
      <div class="qz-panneau">
        <div class="qz-tete"><span class="qz-tag">Classement</span></div>
        <ol id="classement-liste"></ol>
      </div>
    </section>
    <div id="watch" class="cachee">
      <div class="wp-icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></div>
      <div class="wp-txt"><div class="wp-sur" id="wp-sur">On regarde ensemble</div><div class="wp-titre" id="wp-titre"></div></div>
      <div class="wp-compteur"><div class="wp-temps" id="wp-temps"></div><div class="wp-sous" id="wp-sous"></div><div class="wp-etat" id="wp-etat"><b></b><span>En pause</span></div></div>
      <div class="wp-barre"><i id="wp-barre"></i></div>
    </div>
    <div id="watch-top" class="cachee"><div class="wt-sur">Lance ton film dans</div><div class="wt-n" id="wt-n">5</div><div class="wt-sous" id="wt-sous"></div></div>
    <div id="sous-titres" class="cachee"></div>
    <div id="defilant" class="cachee"><div class="piste"></div></div>
    <div id="chat-fil" class="cachee"></div>
    <div id="chat-bulle" class="cachee"><div class="cb-boite"><div class="cb-tete"><i id="cb-p"></i><b id="cb-auteur"></b></div><div id="cb-texte"></div></div></div>
    <div id="qr-ecran" class="cachee"><div class="qr-carte"><div class="qr-code"></div><div class="qr-texte"></div></div></div>
    <div id="logo-coin" class="cachee"></div>
    <div id="bandeau" class="cachee">
      <div class="logo" id="logo"></div>
      <div class="txt">
        <div class="titre" id="bandeau-titre"></div>
        <div class="sous"><span class="direct"><b></b>En direct</span><span class="message" id="bandeau-msg"></span></div>
      </div>
    </div>
  </div>
</div>
<script src="js/vendor/qrcode.js?v=105f38a7"></script>
<script src="js/effets.js?v=4095499a"></script>
<script src="js/common.js?v=8b4ef62b"></script>
<script src="js/fonds3d.js?v=380fb846"></script>
<script src="js/habillages.js?v=69f3df05"></script>
<script src="js/sortie.js?v=61ecaa07"></script>
<script src="js/whip.js?v=7130987e"></script>
<script src="js/diffusion.js?v=112ec235"></script>
</body>
</html>
